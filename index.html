<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game">
        <h1>Rock Paper Scissors</h1>
        <p class="subtitle">Choose one option to play</p>

        <div class="buttons">
            <button onclick="playGame('Rock')">✊ Rock</button>
            <button onclick="playGame('Paper')">✋ Paper</button>
            <button onclick="playGame('Scissors')">✌️ Scissors</button>
        </div>

        <div class="result-box">
            <p id="choice">Computer choice will appear here.</p>
            <h2 id="result">Make your choice!</h2>
        </div>

        <div class="score">
            <span>Wins: <b id="wins">0</b></span>
            <span>Draws: <b id="draws">0</b></span>
            <span>Losses: <b id="losses">0</b></span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
